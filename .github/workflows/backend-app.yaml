name: reusable java builds and security gates

on:
  workflow_call:
    inputs:
      service-dir:
        required: true
        type: string

env:
  APP_DIR: ${{ inputs.service-dir }}
  IMAGE_NAME: java-spring-boot-app
  DEPENDENCY_CHECK_DATA: ~/.dependency-check

jobs:
  build-image:
    runs-on: ubuntu-latest
     
    permissions:
      contents: read
      id-token: write
      security-events: read
      pull-requests: read
      actions: read


    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: set image tag
        id: build-image
        run: echo "image_tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: set up java17 temurin
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: maven verify -compile test coverage 
        run: |
          echo "::group::maven verify -compile test coverage"
          cd ${{ inputs.service-dir }} &&
          mvn verify --no-transfer-progress 
          echo "::endgroup::"

      - name: upload jacoco coverage report
        if: always() # Upload the coverage report even if the previous step fails
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: ${{ inputs.service-dir }}/target/site/jacoco
          retention-days: 5

      - name: Cache Dependency-Check Data
        uses: actions/cache@v4
        with:
          path: $${{env.DEPENDENCY_CHECK_DATA}}
          key: dependency-check-${{ runner.os }}

      - name: OWASP Dependency Check
        working-directory: ${{ inputs.service-dir }}
        run: |
          mvn org.owasp:dependency-check-maven:12.1.8:check \
             -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
             -DdataDirectory=$DEPENDENCY_CHECK_DATA

      - name: Upload Dependency Check Report
        if: always() # Upload the report even if the previous step fails
        uses: actions/upload-artifact@v6
        with:
          name: dependency-check-report
          path: ${{ inputs.service-dir }}/target/dependency-check-report.html


      - name: upload jar artifact
        if: always() # Upload the jar artifact even if the previous step fails
        uses: actions/upload-artifact@v6
        with:
          name: jar-artifact
          path: ${{ inputs.service-dir }}/target/*.jar

      - name: Build Docker image
        working-directory: ${{ inputs.service-dir }}
        run: |
          echo "Building Docker image..." 
          docker build -t $IMAGE_NAME:${{github.sha}} . # Build the Docker image with the short SHA as the tag

      - name: verify Docker image
        run: |
          echo "Verifying Docker image..."
          docker run --rm $IMAGE_NAME:${{github.sha}} java -version # Verify the Docker image by running it and checking the Java version

      - name: docker image scan with trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: $IMAGE_NAME:${{github.sha}} # Scan the Docker image for vulnerabilities using Trivy
          format: 'table'
          exit-code: '0' # Exit with code 1 if vulnerabilities are found
          #severity: 'CRITICAL,HIGH' # Only consider critical and high severity vulnerabilities
          vuln-type: 'os,library' # Scan for both OS and library vulnerabilities
          ignore-unfixed: true # Ignore vulnerabilities that do not have a fix available

      - name: login to docker registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # Use the Docker username stored in GitHub Secrets
          password: ${{ secrets.DOCKER_PASSWORD }} # Use the Docker password stored in GitHub Secrets

      - name: tag docker image
        run: |
          echo "Tagging Docker image..."
          docker tag $IMAGE_NAME:${{github.sha}} ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:${{github.sha}} # Tag the Docker image with the short SHA

      - name: push docker image to registry
        run: |
          echo "Pushing Docker image to registry..."
          docker push ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:${{github.sha}} # Push the Docker image to the registry

          
        
      

     
