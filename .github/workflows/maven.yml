name: CI Pipeline for payment microservice

on: 
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions: 
  contents: read

env:
  APP_DIR: java-spring-boot-app
  IMAGE_NAME: java-spring-boot-app
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source code
        uses: actions/checkout@v4
      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          
      - name: Build Application
        working-directory: ${{env.APP_DIR}}
        run: mvn clean package
        
      - name: Upload JAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: java-spring-boot-app/target/*.jar
          
      - name: Build Docker Image
        working-directory: ${{env.IMAGE_NAME}}
        run: |
          docker build -t \
          $IMAGE_NAME:${{github.sha}} \
          .
      - name: Verify docker images
        run: docker images
        
      

          
