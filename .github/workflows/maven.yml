name: CI Pipeline for payment microservice

on: 
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      
permissions: 
  contents: read
  security-events: write

env:
  APP_DIR: java-spring-boot-app
  IMAGE_NAME: java-spring-boot-app
  DEPENDENCY_CHECK_DATA: ~/.dependency-check
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source code
        uses: actions/checkout@v4
      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          
      - name: Build Application
        working-directory: ${{env.APP_DIR}}
        run: mvn clean package

      - name: Cache Dependency-Check Data
        uses: actions/cache@v4
        with:
          path: $${{env.DEPENDENCY_CHECK_DATA}}
          key: dependency-check-${{ runner.os }}

      - name: OWASP Dependency Check
        working-directory: ${{env.APP_DIR}}
        run: |
          mvn org.owasp:dependency-check-maven:12.1.8:check \
             -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
             -DdataDirectory=$DEPENDENCY_CHECK_DATA
     
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: java-spring-boot-app/target/dependency-check-report.html
        
      - name: Upload JAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: java-spring-boot-app/target/*.jar
          
      - name: Build Docker Image
        working-directory: ${{env.IMAGE_NAME}}
        run: |
          docker build -t \
          $IMAGE_NAME:${{github.sha}} \
          .
      - name: Verify docker images
        run: docker images

      - name: Docker Image Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: 0 #if you want to break pipeline if found severity = HIGH,CRITICAL use exit code 1
          ignore-unfixed: true
          vuln-type: os,library
          #severity: HIGH,CRITICAL

      - name: Login to registry
        if: github.event_name == 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker Image
        run: |
          docker tag \
          $IMAGE_NAME:${{github.sha}} \
          ${{ secrets.DOCKER_USERNAME }}/java-spring-boot-app:${{github.sha}}
          
      - name: Push Docker Image
        if: github.event_name == 'pull_request'
        run: | 
          docker push ${{ secrets.DOCKER_USERNAME }}/java-spring-boot-app:${{github.sha}}
        
      

          
